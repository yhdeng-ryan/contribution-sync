[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contribution-sync"
version = "0.1.0"
description = "Mirror local work commit activity as private empty commits."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
contribution-sync = "contribution_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
